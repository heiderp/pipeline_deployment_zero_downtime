name: Deploy (Blue/Green)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger for testing

env:
  AWS_REGION: us-east-1

jobs:
  # ───────────────────────────────────────────────────────────
  # Lint & Test
  # ───────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    outputs:
      test-passed: ${{ steps.test.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Floci
        uses: floci/setup-floci@v1
        with:
          version: latest

      - name: Run tests
        id: test
        run: floci run --ci

  # ───────────────────────────────────────────────────────────
  # Build & Push Docker Images
  # ───────────────────────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.outputs.test-passed == 'success'
    strategy:
      matrix:
        service:
          - name: flask-app
            context: apps/flask-app
          - name: node-app
            context: apps/node-app
          - name: spring-app
            context: apps/spring-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ steps.tag.outputs.REGISTRY }}/${{ matrix.service.name }}:${{ steps.tag.outputs.TAG }}
            ${{ steps.tag.outputs.REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────
  # Terraform Plan
  # ───────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          terraform plan \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -var="ecr_repo_urls={flask=\"$ECR_REGISTRY/flask-app\",node=\"$ECR_REGISTRY/node-app\",spring=\"$ECR_REGISTRY/spring-app\"}" \
            -out=tfplan
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
          TF_VAR_rds_username: ${{ secrets.RDS_USERNAME }}
          TF_VAR_rds_password: ${{ secrets.RDS_PASSWORD }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ───────────────────────────────────────────────────────────
  # Terraform Apply
  # ───────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          terraform apply -auto-approve \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -var="ecr_repo_urls={flask=\"$ECR_REGISTRY/flask-app\",node=\"$ECR_REGISTRY/node-app\",spring=\"$ECR_REGISTRY/spring-app\"}"
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
          TF_VAR_rds_username: ${{ secrets.RDS_USERNAME }}
          TF_VAR_rds_password: ${{ secrets.RDS_PASSWORD }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ───────────────────────────────────────────────────────────
  # Deploy via CodeDeploy (Blue/Green)
  # ───────────────────────────────────────────────────────────
  deploy-green:
    name: Deploy Green (CodeDeploy)
    needs: terraform-apply
    runs-on: ubuntu-latest
    outputs:
      flask-deployment-id: ${{ steps.deploy-flask.outputs.deployment-id }}
      node-deployment-id: ${{ steps.deploy-node.outputs.deployment-id }}
      spring-deployment-id: ${{ steps.deploy-spring.outputs.deployment-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Flask (CodeDeploy)
        id: deploy-flask
        run: |
          ENV="${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}"
          IMAGE_TAG="${GITHUB_SHA::8}"

          echo "Registering new task definition for flask with image ${IMAGE_TAG}..."
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition "${ENV}-flask" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${ENV}-app" \
            --deployment-group-name "${ENV}-flask" \
            --revision "revisionType=AppSpecContent,appSpecContent={version=0.0,Resources=[{targetService={type=AWS::ECS::Service,properties={taskDefinition=${TASK_DEF_ARN},loadBalancerInfo={containerName=flask-app,containerPort=8080}}}}]}" \
            --query 'deploymentId' \
            --output text)

          echo "deployment-id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "🟢 Flask CodeDeploy deployment: $DEPLOY_ID"

      - name: Deploy Node (CodeDeploy)
        id: deploy-node
        run: |
          ENV="${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}"
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition "${ENV}-node" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${ENV}-app" \
            --deployment-group-name "${ENV}-node" \
            --revision "revisionType=AppSpecContent,appSpecContent={version=0.0,Resources=[{targetService={type=AWS::ECS::Service,properties={taskDefinition=${TASK_DEF_ARN},loadBalancerInfo={containerName=node-app,containerPort=8080}}}}]}" \
            --query 'deploymentId' \
            --output text)

          echo "deployment-id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "🟢 Node CodeDeploy deployment: $DEPLOY_ID"

      - name: Deploy Spring (CodeDeploy)
        id: deploy-spring
        run: |
          ENV="${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}"
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition "${ENV}-spring" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${ENV}-app" \
            --deployment-group-name "${ENV}-spring" \
            --revision "revisionType=AppSpecContent,appSpecContent={version=0.0,Resources=[{targetService={type=AWS::ECS::Service,properties={taskDefinition=${TASK_DEF_ARN},loadBalancerInfo={containerName=spring-app,containerPort=8080}}}}]}" \
            --query 'deploymentId' \
            --output text)

          echo "deployment-id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "🟢 Spring CodeDeploy deployment: $DEPLOY_ID"

  # ───────────────────────────────────────────────────────────
  # Wait for CodeDeploy to finish
  # CodeDeploy handles: deploy green → traffic shift → bake → cleanup
  # ───────────────────────────────────────────────────────────
  wait-deploy:
    name: Wait for CodeDeploy
    needs: deploy-green
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Flask deployment
        run: |
          DEPLOY_ID="${{ needs.deploy-green.outputs.flask-deployment-id }}"
          echo "Waiting for CodeDeploy deployment $DEPLOY_ID..."
          aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"
          echo "✅ Flask deployed successfully"

      - name: Wait for Node deployment
        run: |
          DEPLOY_ID="${{ needs.deploy-green.outputs.node-deployment-id }}"
          aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"
          echo "✅ Node deployed successfully"

      - name: Wait for Spring deployment
        run: |
          DEPLOY_ID="${{ needs.deploy-green.outputs.spring-deployment-id }}"
          aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"
          echo "✅ Spring deployed successfully"

  # ───────────────────────────────────────────────────────────
  # Post-deploy Validation
  # ───────────────────────────────────────────────────────────
  health-check:
    name: Health Check
    needs: wait-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test production endpoints
        run: |
          ALB_DNS="${{ secrets.ALB_DNS_NAME }}"
          for SERVICE in flask-app node-app spring-app; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS}/${SERVICE}/health" || echo "000")
            echo "$SERVICE: HTTP $STATUS"
            [ "$STATUS" = "200" ] || { echo "❌ $SERVICE health check failed"; exit 1; }
          done
          echo "✅ All services healthy"

  # ───────────────────────────────────────────────────────────
  # Rollback notification (CodeDeploy handles actual rollback)
  # ───────────────────────────────────────────────────────────
  rollback:
    name: Notify Rollback
    needs: [deploy-green, wait-deploy, health-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 Deployment ${{ github.sha }} failed or rolled back",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Environment:* ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Action:* CodeDeploy auto-rolled back. Check CloudWatch alarms.\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
